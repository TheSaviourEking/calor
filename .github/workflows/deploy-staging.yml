name: Deploy Mini-Services (Staging)

# Compiles standalone Linux x64 binaries on GitHub Actions, then transfers
# pre-built artifacts to the VPS staging directory (/opt/calor/staging).
on:
  push:
    branches:
      - staging
    paths:
      - 'mini-services/**'
      - 'prisma/schema.prisma'
      - 'ecosystem.config.js'
      - 'Caddyfile.prod'
      - '.github/workflows/deploy-staging.yml'
  pull_request:
    branches:
      - staging
    paths:
      - 'mini-services/**'
      - 'prisma/schema.prisma'
      - 'ecosystem.config.js'
      - 'Caddyfile.prod'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

jobs:
  lint-and-build:
    name: Lint & Compile Staging Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies & Generate Prisma Client
        run: |
          bun install --frozen-lockfile || bun install
          bunx prisma generate

      - name: Lint Mini-Services
        run: |
          bun run lint:services

      - name: Compile Standalone Binaries (Linux x64)
        run: |
          bun run build:services

      - name: Stage Deployment Artifacts
        run: |
          mkdir -p deploy/dist/bin deploy/node_modules
          cp -r dist/bin/* deploy/dist/bin/
          # Copy Prisma engine library directly into dist/bin alongside executables
          cp node_modules/.prisma/client/libquery_engine*.node deploy/dist/bin/
          # Also copy full prisma client folder
          cp -r node_modules/.prisma deploy/node_modules/
          cp ecosystem.config.js deploy/
          cp Caddyfile.prod deploy/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mini-services-staging-dist
          path: deploy/
          retention-days: 1

  deploy-staging:
    name: Push to VPS & Restart Staging PM2
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name != 'pull_request'
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mini-services-staging-dist
          path: deploy/

      - name: Push Pre-Built Artifacts to Staging (/opt/calor/staging)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/*"
          target: "/opt/calor/staging"
          strip_components: 1

      - name: Restart Staging PM2 & Reload Caddy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/calor/staging

            echo "==> Ensuring binary execution permissions..."
            chmod +x dist/bin/*
            mkdir -p /var/log/calor

            echo "==> Checking Caddy configuration..."
            if [ -f Caddyfile.prod ]; then
              cp Caddyfile.prod /etc/caddy/Caddyfile
              caddy validate --config /etc/caddy/Caddyfile 2>/dev/null && systemctl reload caddy 2>/dev/null || true
            fi

            echo "==> Starting / Reloading PM2 processes for Staging..."
            pm2 startOrRestart ecosystem.config.js --only "staging-support-chat,staging-live-stream" --update-env
            pm2 save

            echo "==> Staging Deployment Complete! Process status:"
            pm2 list
