name: Lint, Build & Deploy Mini-Services

# Compiles standalone Linux x64 binaries on GitHub Actions, then transfers
# pre-built artifacts to the VPS.
# - Pushes to 'main' deploy to Production (/opt/calor/prod)
# - Pushes to 'staging' deploy to Staging (/opt/calor/staging)
on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'mini-services/**'
      - 'prisma/schema.prisma'
      - 'ecosystem.config.js'
      - 'Caddyfile.prod'
      - '.github/workflows/deploy-mini-services.yml'
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'mini-services/**'
      - 'prisma/schema.prisma'
      - 'ecosystem.config.js'
      - 'Caddyfile.prod'
      - '.github/workflows/deploy-mini-services.yml'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  lint-and-build:
    name: Lint & Compile Standalone Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies & Generate Prisma Client
        run: |
          bun install --frozen-lockfile || bun install
          bunx prisma generate

      - name: Lint Mini-Services
        run: |
          bun run lint:services

      - name: Compile Standalone Binaries (Linux x64)
        run: |
          bun run build:services

      - name: Stage Deployment Artifacts
        run: |
          mkdir -p deploy/dist/bin deploy/node_modules
          cp -r dist/bin/* deploy/dist/bin/
          # Copy Prisma engine library directly into dist/bin alongside executables
          cp node_modules/.prisma/client/libquery_engine*.node deploy/dist/bin/
          # Also copy the full generated prisma client folder
          cp -r node_modules/.prisma deploy/node_modules/
          cp ecosystem.config.js deploy/
          cp Caddyfile.prod deploy/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mini-services-dist
          path: deploy/
          retention-days: 1

  deploy-to-vps:
    name: Push Build to VPS & Restart PM2
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name != 'pull_request'
    steps:
      - name: Determine Target Environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target_env }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TARGET="production"
          else
            TARGET="staging"
          fi

          if [ "$TARGET" = "production" ]; then
            echo "dir=/opt/calor/prod" >> $GITHUB_OUTPUT
            echo "apps=prod-support-chat-1,prod-support-chat-2,prod-live-stream-1,prod-live-stream-2" >> $GITHUB_OUTPUT
            echo "env_name=Production" >> $GITHUB_OUTPUT
          else
            echo "dir=/opt/calor/staging" >> $GITHUB_OUTPUT
            echo "apps=staging-support-chat,staging-live-stream" >> $GITHUB_OUTPUT
            echo "env_name=Staging" >> $GITHUB_OUTPUT
          fi

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mini-services-dist
          path: deploy/

      - name: Push Pre-Built Artifacts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/*"
          target: "${{ steps.env.outputs.dir }}"
          strip_components: 1

      - name: Restart PM2 & Reload Caddy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ steps.env.outputs.dir }}

            echo "==> Ensuring binary execution permissions..."
            chmod +x dist/bin/*
            mkdir -p /var/log/calor

            echo "==> Checking Caddy configuration..."
            if [ -f Caddyfile.prod ]; then
              cp Caddyfile.prod /etc/caddy/Caddyfile
              caddy validate --config /etc/caddy/Caddyfile 2>/dev/null && systemctl reload caddy 2>/dev/null || true
            fi

            echo "==> Starting / Reloading PM2 processes for ${{ steps.env.outputs.env_name }}..."
            pm2 startOrRestart ecosystem.config.js --only "${{ steps.env.outputs.apps }}" --update-env
            pm2 save

            echo "==> Deployment Complete! Process status:"
            pm2 list
